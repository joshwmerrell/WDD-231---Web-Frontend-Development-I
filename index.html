<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>WDD 231 Learning Workspace</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("wdd231-markdown-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", savedTheme === "dark" ? "#0d1117" : "#f6f8fa");
        }
      } catch {
        // Keep the default dark theme when browser storage is unavailable.
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --page-background: #0d1117;
        --page-text: #e6edf3;
        --header-background: #010409;
        --header-text: #f0f6fc;
        --panel-background: #161b22;
        --border-color: #30363d;
        --link-color: #58a6ff;
        --focus-color: #d29922;
        --code-background: #0d1117;
        --table-heading: #21262d;
        --status-background: #3d2e00;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --page-background: #f6f8fa;
        --page-text: #1f2328;
        --header-background: #1f2328;
        --header-text: #fff;
        --panel-background: #fff;
        --border-color: #d1d9e0;
        --link-color: #0969da;
        --focus-color: #bf8700;
        --code-background: #f6f8fa;
        --table-heading: #f6f8fa;
        --status-background: #fff8c5;
      }

      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--page-text);
        background: var(--page-background);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--page-text);
        background: var(--page-background);
      }

      .site-header {
        padding: 0.75rem 1rem;
        background: var(--header-background);
        color: var(--header-text);
      }

      .site-header-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
        width: min(100%, 960px);
        margin: 0 auto;
      }

      .site-header a {
        color: inherit;
        font-weight: 650;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      .site-brand {
        justify-self: start;
      }

      .site-home-link {
        justify-self: center;
      }

      #theme-toggle {
        justify-self: end;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        color: var(--header-text);
        background: transparent;
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }

      #theme-toggle:hover {
        background: rgb(255 255 255 / 10%);
      }

      .label-for-light-mode {
        display: none;
      }

      :root[data-theme="light"] .label-for-dark-mode {
        display: none;
      }

      :root[data-theme="light"] .label-for-light-mode {
        display: inline;
      }

      #theme-toggle:focus-visible,
      .site-header a:focus-visible {
        outline: 3px solid var(--focus-color);
        outline-offset: 3px;
        border-radius: 2px;
      }

      main {
        width: min(100% - 2rem, 960px);
        margin: 2rem auto;
      }

      .markdown-body {
        padding: clamp(1.25rem, 4vw, 3rem);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        background: var(--panel-background);
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin-top: 1.6em;
        margin-bottom: 0.6em;
        line-height: 1.25;
      }

      .markdown-body h1:first-child {
        margin-top: 0;
      }

      .markdown-body a {
        color: var(--link-color);
        text-underline-offset: 0.18em;
      }

      .markdown-body a:focus-visible,
      .site-header a:focus-visible {
        outline: 3px solid var(--focus-color);
        outline-offset: 4px;
        border-radius: 2px;
      }

      .markdown-body pre {
        overflow-x: auto;
        padding: 1rem;
        border-radius: 0.5rem;
        background: var(--code-background);
      }

      .markdown-body code {
        padding: 0.12em 0.3em;
        border-radius: 0.25rem;
        background: var(--code-background);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .markdown-body pre code {
        padding: 0;
        background: transparent;
      }

      .markdown-body table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      .markdown-body th,
      .markdown-body td {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border-color);
        text-align: left;
        vertical-align: top;
      }

      .markdown-body th {
        background: var(--table-heading);
      }

      .markdown-body img {
        max-width: 100%;
        height: auto;
      }

      #load-status {
        padding: 1rem;
        border-radius: 0.5rem;
        background: var(--status-background);
      }

      #load-status a {
        color: var(--link-color);
      }

      @media (max-width: 560px) {
        .site-header-inner {
          grid-template-columns: 1fr auto;
        }

        .site-home-link {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-self: start;
        }

        #theme-toggle {
          grid-column: 2;
          grid-row: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.3/lib/marked.umd.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script defer src="./markdown-preview.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="./">WDD 231 Learning Workspace</a>
        <a class="site-home-link" href="https://jmerrell.online/">jmerrell.online</a>
        <button id="theme-toggle" type="button">
          <span class="label-for-dark-mode">Light mode</span>
          <span class="label-for-light-mode">Dark mode</span>
        </button>
      </div>
    </header>
    <main id="main-content">
      <p id="load-status" role="status" aria-live="polite">Loading Markdown preview…</p>
      <article id="readme-content" class="markdown-body" aria-label="Rendered Markdown document" aria-busy="true"></article>
    </main>
    <noscript>
      <p>JavaScript is needed to render this Markdown preview. <a href="README.md">Open the README Markdown file.</a></p>
    </noscript>
  </body>
</html>
